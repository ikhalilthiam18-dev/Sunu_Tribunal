name: SunuTribunal CI

# Le déploiement est fait par Railway (connecté au dépôt GitHub, option « Wait for CI ») :
# chaque push sur main est redéployé seulement si ces vérifications passent.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Frontend : build ───────────────────────────
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # ── Backend : tests sur PostgreSQL ─────────────
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sunutribunal
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      SECRET_KEY: cle-de-test-ci
      DEBUG: 'False'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sunutribunal

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check deploy settings
        run: python manage.py check --deploy --fail-level ERROR

      - name: Create tables (comme backend/start.sh)
        run: |
          python manage.py migrate auth --noinput
          python manage.py migrate --run-syncdb --noinput

      - name: Run tests
        run: python manage.py test apps
