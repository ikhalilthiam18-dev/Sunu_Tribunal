# Essai local de la configuration de production : docker compose up --build
# puis http://localhost:3000 (frontend) et http://localhost:8000/admin (backend)

services:
  # ── PostgreSQL ─────────────────────────────────────
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: sunutribunal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Django Backend ─────────────────────────────────
  backend:
    build:
      context: ./backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - media_volume:/app/media
    environment:
      - SECRET_KEY=sunutribunal-docker-local-uniquement
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/sunutribunal
      - CORS_ORIGINS=http://localhost:3000
      # Pas de HTTPS en local : cookies non sécurisés acceptés par Django Admin
      - DEBUG=True
    depends_on:
      db:
        condition: service_healthy

  # ── React Frontend ─────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  media_volume:
